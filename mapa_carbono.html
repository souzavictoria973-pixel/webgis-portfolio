<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Carbono Medio por Municipio - CAR/MS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 100vh; }
    body { margin: 0; font-family: Arial, sans-serif; }
    .legenda { background: white; padding: 10px; line-height: 20px; font-size: 13px; box-shadow: 0 0 8px rgba(0,0,0,0.3); }
    .legenda i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.8; }
    .titulo { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 8px 14px; box-shadow: 0 0 8px rgba(0,0,0,0.3); font-weight: bold; }
  </style>
</head>
<body>
  <div class="titulo">Carbono Medio por Municipio (imoveis CAR)<br><small>Mato Grosso do Sul - NASA/ORNL Biomass Carbon Density</small></div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var map = L.map("map").setView([-20.5, -54.7], 7);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "OpenStreetMap" }).addTo(map);

    function cor(c) {
      return c > 100 ? "#00441b" :
             c > 80  ? "#1b7837" :
             c > 60  ? "#5aae61" :
             c > 40  ? "#a6dba0" :
             c > 20  ? "#d9f0d3" : "#f7fcf5";
    }

    fetch("http://127.0.0.1:8001/carbono")
      .then(function (r) { return r.json(); })
      .then(function (dados) {
        var camada = L.geoJSON(dados, {
          style: function (f) {
            return { fillColor: cor(f.properties.carbono_medio_mgha), weight: 0.5, color: "#666", fillOpacity: 0.75 };
          },
          onEachFeature: function (f, layer) {
            var p = f.properties;
            layer.bindPopup(
              "<b>" + p.nome + "</b>" +
              "<br>Imoveis CAR: " + p.n_imoveis +
              "<br>Area CAR: " + Number(p.area_car_ha).toFixed(1) + " ha" +
              "<br>Carbono medio: " + Number(p.carbono_medio_mgha).toFixed(1) + " Mg C/ha" +
              "<br>Carbono total: " + Number(p.carbono_total_mg).toLocaleString() + " Mg C"
            );
          }
        }).addTo(map);
        map.fitBounds(camada.getBounds());
      });

    var legenda = L.control({ position: "bottomright" });
    legenda.onAdd = function () {
      var div = L.DomUtil.create("div", "legenda");
      var faixas = [0, 20, 40, 60, 80, 100];
      div.innerHTML = "<b>Mg C/ha</b><br>";
      for (var i = 0; i < faixas.length; i++) {
        div.innerHTML += '<i style="background:' + cor(faixas[i] + 1) + '"></i> ' + faixas[i] + (faixas[i + 1] ? "&ndash;" + faixas[i + 1] + "<br>" : "+");
      }
      return div;
    };
    legenda.addTo(map);
  </script>
</body>
</html>
